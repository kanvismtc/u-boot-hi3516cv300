name: Build U-Boot
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev lzma libssl-dev libncurses5

      - name: Download Toolchain
        run: |
          wget -q https://github.com || wget -q https://github.com
          sudo tar -xf arm-hisiv510-linux.tar.xz -C /opt/
          echo "/opt/arm-hisiv510-linux/bin" >> $GITHUB_PATH

      - name: Compile U-Boot
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: u-boot-binaries
          path: "*.bin"
